[project]
name = "dssgnn"
version = "1.0.0"
description = "DSS-GNN: a unified uncertainty representation for graph neural networks via doubly-spectral stochastic expansion (NeurIPS 2026)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.5.0,<2.6",
  "torchvision>=0.20.0",
  "torch_geometric>=2.5",
  "torch-sparse",
  "torch-scatter",
  "ogb>=1.3.6",
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "scikit-learn",
  "tqdm",
  "pyyaml>=6.0",
  "networkx",
  "gdown",
  # Used by the vendored GOOD benchmark (GOOD_clean/) and G-DeltaUQ (gduq/)
  "munch==2.5.0",
  "ruamel.yaml>=0.17.21",
  "typed-argument-parser>=1.7.2",
  "cilog>=1.2.3",
  "torchmetrics",
  "tensorboard",
  "pynvml",
  "cvxopt",
  "psutil",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
find-links = ["https://data.pyg.org/whl/torch-2.5.1+cu124.html"]

# torch-scatter / torch-sparse need torch and numpy at build time when no
# pre-built wheel matches (Linux CUDA wheels come from the PyG find-links page).
[tool.uv.extra-build-dependencies]
torch-scatter = ["torch", "numpy"]
torch-sparse = ["torch", "numpy"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }
